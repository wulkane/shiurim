<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>נתוני האזנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@500;600&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4ede1; --card:#fbf7f0; --soft:#f0e6d6; --ink:#2f2219; --muted:#76604b; --line:#e2d3bc; --accent:#8a5a2b; --gold:#a97b3c; --bar:#c99c5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1510; --card:#241c15; --soft:#2e241b; --ink:#f1e7d8; --muted:#b9a48a; --line:#3e3125; --accent:#d09a5c; --gold:#d2aa6a; --bar:#b98a4e; } }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Assistant', Arial, sans-serif; font-size:17px; background:var(--bg); color:var(--ink); line-height:1.5; padding-bottom:60px; }
  .wrap { max-width:960px; margin:0 auto; padding:0 16px; }
  header { padding:36px 0 18px; }
  h1 { font-family:'Noto Serif Hebrew', serif; font-weight:600; font-size:clamp(30px,6vw,44px); }
  .sub { color:var(--muted); margin-top:4px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:18px 0; }
  .chip, select, button { font:inherit; font-size:15px; font-weight:600; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:var(--card); }
  .grow { flex:1; }
  .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card .n { font-family:'Noto Serif Hebrew', serif; font-weight:600; font-size:36px; line-height:1.1; }
  .card .l { color:var(--muted); font-size:15px; margin-top:4px; }
  .card .t { font-size:14px; margin-top:6px; color:var(--accent); font-weight:600; }
  h2 { font-family:'Noto Serif Hebrew', serif; font-weight:600; font-size:24px; margin:34px 0 10px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 18px; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; padding:11px 0; border-top:1px solid var(--line); align-items:center; }
  .row:first-child { border-top:0; }
  .row .name { font-weight:600; min-width:0; }
  .row .name small { display:block; font-weight:400; color:var(--muted); font-size:13.5px; }
  .row .num { font-weight:700; font-variant-numeric:tabular-nums; }
  .track { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--soft); overflow:hidden; }
  .track i { display:block; height:100%; background:var(--bar); border-radius:3px; }
  .days { display:flex; align-items:flex-end; gap:2px; height:90px; padding:10px 0 4px; direction:ltr; }
  .days i { flex:1; background:var(--bar); border-radius:2px 2px 0 0; min-height:2px; }
  .note { color:var(--muted); font-size:14.5px; margin-top:26px; }
  .msg { padding:28px; text-align:center; color:var(--muted); }
  [hidden] { display:none !important; }
  .find { width:100%; margin-bottom:22px; font:inherit; font-size:16px; padding:11px 16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .plats { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
  .plats span { font-size:13px; font-weight:400; background:var(--soft); border-radius:999px; padding:1px 10px; color:var(--muted); }
  .pod-title { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:34px 0 10px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  .pod-title h3 { font-family:'Noto Serif Hebrew', serif; font-weight:600; font-size:26px; }
  .pod-title span { color:var(--muted); font-weight:600; }
  details.folder { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:10px; overflow:hidden; }
  details.folder > summary { list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:baseline; gap:12px; }
  details.folder > summary::-webkit-details-marker { display:none; }
  details.folder > summary::before { content:'+'; color:var(--gold); font-size:22px; line-height:1; width:14px; transition:transform .2s; }
  details.folder[open] > summary::before { transform:rotate(45deg); }
  .fname { font-family:'Noto Serif Hebrew', serif; font-weight:600; font-size:20px; }
  .fmeta { color:var(--muted); font-size:14px; }
  .fnum { margin-inline-start:auto; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
  .flist { padding:0 18px 6px; }
  .flist .row:first-child { border-top:1px solid var(--line); }
</style>
</head>
<body>
<header class="wrap">
  <h1>נתוני האזנה</h1>
  <p class="sub">כמה האזנות היו לכל שיעור, ובאיזו אפליקציה. אנונימי: אין שמות ואין כתובות.</p>
  <div class="bar" id="bar"></div>
  <input id="find" class="find" type="search" placeholder="חיפוש שיעור לפי שם" aria-label="חיפוש שיעור">
</header>
<main class="wrap" id="main"><p class="msg">טוען…</p></main>

<script src="data.js"></script>
<script>
const API = 'https://shiurim-media.wulkane.workers.dev';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY_NAME = 'stats-key';

// the key travels in the address after "#", which browsers never send to any server; it is kept
// on this device so the bookmark can be shorter afterwards
let key = new URLSearchParams(location.hash.slice(1)).get('key');
try { if (key) localStorage.setItem(KEY_NAME, key); else key = localStorage.getItem(KEY_NAME); } catch (e) {}
if (key) history.replaceState(null, '', location.pathname);

const lessonInfo = {};
(window.DATA || []).forEach(p => p.seasons.forEach(s => s.lessons.forEach(l =>
  lessonInfo[l.id] = { title: l.title, pod: p.name, season: s.name })));

const PERIODS = [[7, '7 ימים'], [30, '30 יום'], [90, '90 יום'], [365, 'שנה'], [0, 'הכול']];
const plain = s => s.toLowerCase().replace(/["'׳״]/g, '');   // chazal = חז"ל = חז״ל
let sortBy = 'catalog';               // 'catalog' (in order of the parashot) or 'plays'
const openKeys = new Set();           // folders left open across redraws
let days = 0, podFilter = '', data = null;   // "all" by default: it is the only view that includes the Spotify import

async function api(path) {
  const r = await fetch(API + path, { headers: { authorization: 'Bearer ' + key } });
  if (r.status === 401) throw new Error('auth');
  if (!r.ok) throw new Error('http ' + r.status);
  return r;
}

async function load() {
  $('main').innerHTML = '<p class="msg">טוען…</p>';
  try { data = await (await api('/stats/data?days=' + days)).json(); }
  catch (e) {
    $('main').innerHTML = e.message === 'auth'
      ? '<p class="msg">אין גישה. פתח את הקישור הסודי המלא שקיבלת, זה שנגמר ב-<b>#key=…</b></p>'
      : '<p class="msg">לא הצלחתי לטעון את הנתונים. נסה שוב בעוד רגע.</p>';
    return;
  }
  render();
}

function bars() {
  const pods = [...new Set(Object.values(lessonInfo).map(l => l.pod))];
  $('bar').innerHTML =
    PERIODS.map(([d, t]) => `<button class="chip${d === days ? ' on' : ''}" data-days="${d}">${t}</button>`).join('') +
    '<span class="grow"></span>' +
    `<select id="pod" aria-label="פודקאסט"><option value="">כל הפודקאסטים</option>${pods.map(p => `<option${p === podFilter ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select>` +
    `<button id="sort">מיון: ${sortBy === 'catalog' ? 'לפי סדר הפרשות' : 'לפי האזנות'}</button>` +
    '<button id="expand">פתיחה/סגירה של הכול</button>' +
    '<button id="csv">הורדת קובץ CSV</button>';
}

// Lessons grouped like the site: podcast -> topic (season) -> lesson, each level with its total.
// A podcast with a single unnamed season (the holidays) lists its lessons directly.
function folders(per) {
  const sum = list => list.reduce((n, x) => n + x.total, 0);
  const chips = l => Object.entries(l.plats).sort((a, b) => b[1] - a[1]).map(([p, n]) => `<span>${esc(p)}: ${n}</span>`).join('');
  const lessonRow = (l, max) => `<div class="row lesson" data-text="${esc(plain(l.title))}">
      <div class="name">${esc(l.title)}<div class="plats">${chips(l)}</div></div><div class="num">${l.total}</div>
      <div class="track"><i style="width:${l.total / max * 100}%"></i></div></div>`;
  return (window.DATA || []).filter(p => !podFilter || p.name === podFilter).map(p => {
    const seasons = p.seasons.map(s => {
      const lessons = s.lessons.filter(l => per[l.id]).map(l => ({ id: l.id, title: l.title, ...per[l.id] }));
      if (sortBy === 'plays') lessons.sort((a, b) => b.total - a.total);
      return { name: s.name, lessons, total: sum(lessons), count: s.lessons.length };
    }).filter(s => s.lessons.length);
    if (!seasons.length) return '';
    const max = Math.max(...seasons.flatMap(s => s.lessons.map(l => l.total)));
    const body = seasons.length === 1 && !seasons[0].name
      ? `<div class="panel">${seasons[0].lessons.map(l => lessonRow(l, max)).join('')}</div>`
      : seasons.map(s => {
          const k = p.name + '|' + s.name;
          return `<details class="folder" data-key="${esc(k)}"${openKeys.has(k) ? ' open' : ''}>
            <summary><span class="fname">${esc(s.name)}</span><span class="fmeta">${s.lessons.length} מתוך ${s.count} שיעורים</span><span class="fnum">${s.total}</span></summary>
            <div class="flist">${s.lessons.map(l => lessonRow(l, max)).join('')}</div></details>`;
        }).join('');
    return `<section class="podgroup"><div class="pod-title"><h3>${esc(p.name)}</h3><span>${sum(seasons)} האזנות</span></div>${body}</section>`;
  }).join('');
}

// quick filter over the lessons already on the page; folders with a match open by themselves
function applyFind() {
  const q = plain($('find').value.trim());
  document.querySelectorAll('.lesson').forEach(r => r.hidden = !!q && !r.dataset.text.includes(q));
  document.querySelectorAll('.folder').forEach(d => {
    const hit = [...d.querySelectorAll('.lesson')].some(r => !r.hidden);
    d.hidden = !hit; if (q && hit) d.open = true;
  });
  document.querySelectorAll('.podgroup').forEach(g => g.hidden = ![...g.querySelectorAll('.lesson')].some(r => !r.hidden));
}

function render() {
  bars();
  // Totals exported by hand (Spotify) are since the show started, so they only fit the "all" view
  const imp = data.imported || [];
  const impDate = imp.length ? imp[0].as_of.split('-').reverse().join('.') : '';
  const useImp = days === 0 && imp.length > 0;
  const all = data.byLesson.concat(useImp ? imp.map(r => ({ lesson: r.lesson, platform: r.platform, listeners: r.plays })) : []);
  const rows = all.filter(r => !podFilter || (lessonInfo[r.lesson] || {}).pod === podFilter);
  if (!rows.length) { $('main').innerHTML = '<p class="msg">עדיין אין נתונים לתקופה הזאת.</p>'; return; }
  const impNote = useImp
    ? `Spotify: סך כל ההשמעות וההורדות מתחילת הפודקאסט, כפי שיוצאו ב-${impDate}. הוא לא מתעדכן לבד, וצריך לייצא שוב מ-Spotify כדי לרענן.`
    : (imp.length ? `נתוני Spotify (מיוצאים ב-${impDate}) מוצגים רק בתצוגת „הכול”.` : '');

  const per = {};            // lesson -> {total, plats:{name:n}}
  const plat = {};           // platform -> n
  rows.forEach(r => {
    const l = per[r.lesson] ||= { total: 0, plats: {} };
    l.total += r.listeners; l.plats[r.platform] = (l.plats[r.platform] || 0) + r.listeners;
    plat[r.platform] = (plat[r.platform] || 0) + r.listeners;
  });
  const total = Object.values(per).reduce((n, l) => n + l.total, 0);
  const ranked = Object.entries(per).sort((a, b) => b[1].total - a[1].total);
  const top = ranked[0], topPlat = Object.entries(plat).sort((a, b) => b[1] - a[1])[0];
  const name = id => (lessonInfo[id] || { title: id }).title;
  const maxP = topPlat[1];

  const dayMap = Object.fromEntries(data.byDay.map(d => [d.day, d.listeners]));
  const span = days || 90, series = [];
  for (let i = span - 1; i >= 0; i--) series.push(dayMap[new Date(Date.now() - i * 864e5).toISOString().slice(0, 10)] || 0);
  const maxD = Math.max(...series, 1);

  $('main').innerHTML = `
    ${!useImp && imp.length ? `<p class="note" style="margin:0 0 14px">${esc(impNote)}</p>` : ''}
    <div class="cards">
      <div class="card"><div class="n">${total}</div><div class="l">האזנות בתקופה</div></div>
      <div class="card"><div class="n">${ranked.length}</div><div class="l">שיעורים שהושמעו</div></div>
      <div class="card"><div class="n">${top[1].total}</div><div class="l">השיעור המוביל</div><div class="t">${esc(name(top[0]))}</div></div>
      <div class="card"><div class="n">${topPlat[1]}</div><div class="l">האפליקציה המובילה</div><div class="t">${esc(topPlat[0])}</div></div>
    </div>
    <h2>לפי יום</h2>
    <div class="panel"><div class="days">${series.map(n => `<i style="height:${Math.max(n / maxD * 100, 2)}%" title="${n}"></i>`).join('')}</div></div>
    <h2>לפי אפליקציה</h2>
    <div class="panel">${Object.entries(plat).sort((a, b) => b[1] - a[1]).map(([p, n]) =>
      `<div class="row"><div class="name">${esc(p)}</div><div class="num">${n}</div><div class="track"><i style="width:${n / maxP * 100}%"></i></div></div>`).join('')}</div>
    <h2>לפי פודקאסט ונושא</h2>
    ${folders(per)}
    <p class="note">האתר ורוב אפליקציות הפודקאסטים נספרים בשרת שלנו: האזנה אחת לכל מאזין ביום לכל שיעור.${impNote ? '<br>' + esc(impNote) : ''}<br>ההאזנות ב-YouTube נמצאות בלוח הנתונים של YouTube, ולא כאן.</p>`;
  applyFind();
}

document.addEventListener('click', async e => {
  const d = e.target.closest('[data-days]');
  if (d) { days = +d.dataset.days; return load(); }
  if (e.target.id === 'sort') { sortBy = sortBy === 'catalog' ? 'plays' : 'catalog'; return render(); }
  if (e.target.id === 'expand') {
    const all = [...document.querySelectorAll('.folder:not([hidden])')];
    const open = all.some(f => !f.open);
    all.forEach(f => f.open = open);
    return;
  }
  if (e.target.id === 'csv') {
    try {
      const blob = await (await api('/stats/export.csv?days=' + days)).blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'listening.csv'; a.click();
    } catch (err) { alert('ההורדה נכשלה'); }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'pod') { podFilter = e.target.value; render(); } });
document.addEventListener('toggle', e => {          // "toggle" doesn't bubble, so listen while capturing
  const f = e.target.closest && e.target.closest('.folder');
  if (f) f.open ? openKeys.add(f.dataset.key) : openKeys.delete(f.dataset.key);
}, true);
$('find').addEventListener('input', applyFind);

if (key) load(); else { bars(); $('main').innerHTML = '<p class="msg">אין גישה. פתח את הקישור הסודי המלא שקיבלת.</p>'; }
</script>
</body>
</html>
